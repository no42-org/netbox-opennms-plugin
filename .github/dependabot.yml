# Keep SHA-pinned GitHub Actions and the Python dependencies current (Story 4.4).
# The 7-day cooldown lets upstream compromises be caught and yanked before a
# bump PR pulls them in (zizmor: dependabot-cooldown).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  # The repo has no Dockerfiles — container images are pinned in Compose files,
  # which the "docker" ecosystem does not scan (it fails the update job).
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/quickstart"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # One PR moves the tested pin (compose.yml) and the quickstart pin
      # together — the quality gates assert they agree, so separate PRs
      # per directory would each stay red.
      netbox:
        patterns:
          - "netboxcommunity/netbox"
      # Same reason: the integration pin (compose.integration.yml) and the
      # quickstart pin move as one PR so a single `make integration` run
      # covers both.
      opennms:
        patterns:
          - "opennms/horizon"
