# CI for netbox-opennms-plugin. Lint/test/build live in the reusable
# quality-gates workflow (shared with Release); only the slow live-OpenNMS
# round-trip is CI-specific.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Supersede in-flight runs for the same ref; a force-push shouldn't leave
# stale jobs consuming runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    # zizmor 1.30 wants GitHub's `$/` self-repository syntax here, but
    # actionlint v1.7.12 rejects `$/` as a malformed workflow call
    # (rhysd/actionlint#711, #732 — both open, no release supports it yet).
    # Both linters gate this repo, so keep `./` until actionlint catches up,
    # then drop this suppression and switch to `$/`.
    uses: ./.github/workflows/quality-gates.yml  # zizmor: ignore[self-repository]

  integration:
    name: Live OpenNMS Horizon 36 round-trip
    runs-on: ubuntu-24.04
    # Bound the run — OpenNMS boot is slow and the healthcheck can loop a while.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: make integration
        run: make integration
