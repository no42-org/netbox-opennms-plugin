# Quality gates, defined ONCE and shared by the CI and Release workflows — a
# release can never publish through a gate PRs enforce. Jobs call Makefile
# targets only, so local and CI stay identical.
name: Quality gates
on:
  workflow_call:
    inputs:
      upload-dist:
        description: Upload the built dist/ as a workflow artifact (release publishing)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    # No matrix, and no version in the name. This is a required status check, and
    # GitHub appends matrix values to the job name, so a single-entry matrix put
    # the NetBox version into the context. Every pin bump then renamed the check
    # into one the ruleset can never satisfy, blocking all merges until branch
    # protection was edited. The version now comes from compose.yml alone.
    # To test several NetBox versions, add the matrix back and gate on a separate
    # aggregator job with a static name, not on the matrix legs themselves.
    name: Lint + test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: make verify
        run: make verify

  build:
    name: Build + verify wheel ships templates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Same AST read release.yml uses for the tag check — importing the
      # module needs NetBox. Keeps the README's Dockerfile install pin from
      # rotting: the version-bump PR fails until the pin is bumped too.
      - name: Assert README install pin matches __version__
        run: |
          python3 - <<'PY'
          import ast, re, sys

          tree = ast.parse(open("netbox_opennms/__init__.py").read())
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(t, ast.Name) and t.id == "__version__"
                  for t in node.targets
              ):
                  version = node.value.value
                  break
          else:
              sys.exit("no __version__ in netbox_opennms/__init__.py")
          pins = re.findall(
              r"netbox-opennms-plugin==([\w.]+)", open("README.md").read()
          )
          if not pins:
              sys.exit("README.md has no netbox-opennms-plugin==X.Y.Z pin")
          if stale := [p for p in pins if p != version]:
              sys.exit(
                  f"README.md pins {stale} but __version__ is {version!r} — "
                  "bump the README install pin in the version-bump PR"
              )
          print(f"ok: README pin matches __version__ {version}")
          PY
      - name: make build
        run: make build
      - name: Assert the wheel contains the templates
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "netbox_opennms/templates/netbox_opennms/requisition.html",
              "netbox_opennms/templates/netbox_opennms/dry_run.html",
              "netbox_opennms/templates/netbox_opennms/monitoringoverride.html",
              "netbox_opennms/templates/netbox_opennms/sync_preview.html",
              "netbox_opennms/templates/netbox_opennms/connection_test.html",
              "netbox_opennms/templates/netbox_opennms/inc/sync_status_panel.html",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel is missing templates: {missing}")
          print(f"ok: all templates present in {wheel}")
          PY
      - if: ${{ inputs.upload-dist }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  lint-workflows:
    name: Lint workflows (actionlint + zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # docker:// refs pin by image digest, not commit SHA.
      - uses: docker://rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7  # v1.7.12
        with:
          args: -color
      # advanced-security off: plain findings instead of a SARIF upload, so the
      # gate also passes on Dependabot's read-only token (no security-events).
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054  # v0.6.2
        with:
          advanced-security: "false"
