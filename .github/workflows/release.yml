# PyPI release for netbox-opennms-plugin. Runs when a GitHub Release is
# published (never on raw tag pushes). Quality gates come from the reusable
# quality-gates workflow (shared with CI); publishing uses PyPI Trusted
# Publishing (OIDC) — no API token secrets.
#
# The PyPI trusted-publisher binding is registered against THIS filename
# (release.yml) and the `pypi` environment. Renaming either breaks OIDC
# authentication until the binding on pypi.org is updated.
name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
# Serialize releases, but NEVER cancel one: a half-cancelled release could
# publish to PyPI without attaching provenance to the GitHub Release.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  version:
    name: Assert release tag matches __version__
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Assert release tag matches __version__
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - "$TAG" <<'PY'
          import ast, sys

          tag = sys.argv[1].removeprefix("v")
          # Same AST read pyproject uses — importing the module needs NetBox.
          tree = ast.parse(open("netbox_opennms/__init__.py").read())
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(t, ast.Name) and t.id == "__version__"
                  for t in node.targets
              ):
                  version = node.value.value
                  break
          else:
              sys.exit("no __version__ in netbox_opennms/__init__.py")
          if tag != version:
              sys.exit(
                  f"release tag says {tag!r} but __version__ is {version!r} — "
                  "merge the version-bump PR before releasing"
              )
          print(f"ok: release tag matches __version__ {version}")
          PY

  gates:
    uses: ./.github/workflows/quality-gates.yml
    with:
      upload-dist: true

  publish:
    name: Publish to PyPI (trusted publishing)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [version, gates]
    environment:
      name: pypi
      url: https://pypi.org/project/netbox-opennms-plugin/
    permissions:
      id-token: write  # OIDC — only this job may mint publish tokens
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1

  supply-chain:
    name: Attach dist, SBOM and provenance to the GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [version, gates]
    permissions:
      contents: write      # upload release assets
      id-token: write      # sigstore signing for provenance
      attestations: write  # SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      # The SBOM must describe the shipped wheel AND its declared dependency
      # chain (requests → urllib3/certifi/idna/charset-normalizer), so
      # pip-install the wheel into a clean target and scan the result — a bare
      # wheel scan misses the dependencies, a source-tree scan catalogs
      # .github/workflows/ actions instead of the plugin. NetBox is
      # intentionally absent: it is the host application, not a pip
      # dependency (see pyproject.toml). --only-binary=:all: keeps the
      # dependency resolve wheels-only, so no sdist build script can run in
      # this job (it holds id-token: write).
      - name: Install wheel with dependencies for SBOM scan
        run: >-
          python3 -m pip install --quiet --only-binary=:all:
          --target sbom-root dist/*.whl
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: sbom-root
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # Post-process syft's output:
      # 1. Drop the SPDX "document root" package it emits for the scanned
      #    folder — scaffolding, not a shipped component; it renders as a
      #    license-less entry in the report. Re-point DOCUMENT DESCRIBES at
      #    the real packages it contained.
      # 2. Normalize supplier/originator/homepage on the plugin's own package
      #    (only — dependency metadata stays as upstream declares it): syft
      #    copies the wheel's Author (a person) into both party fields and
      #    leaves homepage unset.
      - name: Normalize the SBOM
        run: |
          python3 - <<'PY'
          import json
          path = "dist/sbom.spdx.json"
          d = json.load(open(path))
          roots = {p["SPDXID"] for p in d["packages"]
                   if p["SPDXID"].startswith("SPDXRef-DocumentRoot-")}
          assert roots, "no document-root package found — syft output changed?"
          d["packages"] = [p for p in d["packages"] if p["SPDXID"] not in roots]
          rels, described = [], []
          for r in d.get("relationships", []):
              a, b, t = (r["spdxElementId"], r["relatedSpdxElement"],
                         r["relationshipType"])
              if a in roots and t == "CONTAINS":
                  described.append(b)
                  continue
              if a in roots or b in roots:
                  continue
              rels.append(r)
          rels += [{"spdxElementId": "SPDXRef-DOCUMENT",
                    "relationshipType": "DESCRIBES",
                    "relatedSpdxElement": x} for x in described]
          d["relationships"] = rels
          own = 0
          for p in d["packages"]:
              purl = next((r["referenceLocator"]
                           for r in p.get("externalRefs", [])
                           if r.get("referenceType") == "purl"), "")
              if purl.startswith("pkg:pypi/netbox-opennms-plugin"):
                  p["supplier"] = "Organization: No42.org (ronny@no42.org)"
                  p["originator"] = "Organization: No42.org"
                  p["homepage"] = (
                      "https://github.com/no42-org/netbox-opennms-plugin")
                  own += 1
          assert own == 1, f"expected exactly 1 own package, found {own}"
          json.dump(d, open(path, "w"), indent=1)
          print(f"stripped {sorted(roots)}; document describes "
                f"{len(described)} packages; normalized the plugin package")
          PY
      # Self-contained offline HTML rendering of the SBOM. Written into dist/
      # so it is attested and attached to the release like the JSON SBOM.
      # version/project/commit/build-url default from the workflow context.
      - name: HTML SBOM report
        id: sbom-report
        uses: no42-org/blitsbom/report@38567e05bf41bd3348d928b657eca0efeeaa7db6  # v0.4.0
        with:
          sbom: dist/sbom.spdx.json
          output: dist/sbom-report.html
          # Generator image pinned by digest to match the action version.
          image: ghcr.io/no42-org/blitsbom@sha256:40d888fa2cc7e8aa2c0f63268bbe06c0c9a8742c1aa9c6b86abfbe1ebce39741  # v0.4.0 (tag report-0.4.0)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-report
          path: ${{ steps.sbom-report.outputs.report }}
          if-no-files-found: error
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: dist/*
      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: find dist -type f -exec gh release upload "$TAG" --clobber {} +
