# Throwaway test stack for the netbox-opennms plugin (Makefile-driven).
# Not a deployment compose — Postgres data is tmpfs (ephemeral) and the secrets
# are fixed throwaway values for the test DB only. See the Makefile for targets.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox
    tmpfs:
      # postgres:18 moved PGDATA below /var/lib/postgresql (not .../data), so the
      # ephemeral mount covers the parent — it matches the image's declared volume.
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "netbox", "-d", "netbox"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine

  netbox:
    # This literal pin is the single source of the tested NetBox version, so
    # local and CI runs are reproducible and query_counts.json means something.
    # It must stay literal: Dependabot's docker-compose ecosystem cannot resolve
    # a ${VAR:-default} substitution, so only a plain tag gets bump PRs —
    # grouped with quickstart/compose.yml in dependabot.yml, and the quality
    # gates assert both pins and the README's "verified against" agree. Runs
    # against another tag still work: setting NETBOX_VERSION makes the Makefile
    # add compose.override.netbox.yml (the weekly canary uses that for v4.6).
    image: netboxcommunity/netbox:v4.7.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SECRET_KEY: throwaway-test-secret-key-0123456789-abcdefghijklmnop
      API_TOKEN_PEPPER_1: throwaway-token-pepper-0123456789-abcdefghijklmnopqr
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox
      DB_PORT: "5432"
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_CACHE_HOST: redis
      REDIS_CACHE_DATABASE: "1"
      ALLOWED_HOSTS: "*"
      # The plugin source is mounted here and added to the path so NetBox imports
      # it; DEVELOPER lets `makemigrations` run against the image.
      PYTHONPATH: /source
      DEVELOPER: "true"
    volumes:
      - ./:/source
      - ./tests/config/plugins.py:/etc/netbox/config/plugins.py:ro
    working_dir: /opt/netbox/netbox
    entrypoint: ["/bin/bash", "-c"]
    # Default command = run the suite. Targets that need a different command
    # (makemigrations, query-count regen) override it via `compose run`.
    command: ["/opt/netbox/venv/bin/python manage.py test netbox_opennms -v2"]
